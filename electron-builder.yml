appId: "io.github.12g3nd.lacquer"
productName: "Lacquer"
files:
  - '!*'
  - dist
  - assets
  - license
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
win:
  # The generated multi-size .ico rather than the 1024 PNG: its 16/24/32 entries
  # carry the de-wreathed glyph; the 32px entry begins the full crest.
  icon: assets/generated/icons/win/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  compression: maximum
# `nsis-web` downloads its payload from a published release. There is no release
# feed for a personal fork, so that installer would have nothing to fetch — this
# is a self-contained one.
nsis:
  oneClick: true
  perMachine: false # per-user install, so no UAC prompt
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: false # the desktop is deliberately kept empty
  shortcutName: Lacquer
directories:
  output: ./pack/
