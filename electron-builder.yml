appId: "io.github.12g3nd.lacquer"
productName: "Lacquer"
files:
  - '!*'
  - dist
  - assets
  - license
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
win:
  icon: assets/icon.png
  target:
    - target: nsis-web
      arch:
        - x64
    - target: portable
      arch:
        - x64
  compression: maximum
nsisWeb:
  runAfterFinish: false
directories:
  output: ./pack/
